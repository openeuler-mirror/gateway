[package]
name = "boom-main"
version.workspace = true
edition.workspace = true

[[bin]]
name = "boom-gateway"
path = "src/main.rs"

[features]
default = []
debug-tools = ["boom-dashboard/debug-tools"]
# OTLP push for prompt log entries. Inherited from boom-promptlog's default
# feature set — the exporter only activates at runtime when
# `prompt_log.otlp.enabled` is true in YAML.
otlp = ["boom-promptlog/otlp"]

[dependencies]
boom-core = { path = "../boom-core" }
boom-config = { path = "../boom-config" }
boom-auth = { path = "../boom-auth" }
boom-provider = { path = "../boom-provider" }
boom-limiter = { path = "../boom-limiter" }
boom-routing = { path = "../boom-routing" }
boom-audit = { path = "../boom-audit" }
boom-dashboard = { path = "../boom-dashboard", default-features = false }
boom-ctxaware = { path = "../boom-ctxaware" }
boom-flowcontrol = { path = "../boom-flowcontrol" }
boom-promptlog = { path = "../boom-promptlog" }
boom-kvindex = { path = "../boom-kvindex" }
boom-hooks-sdk = { path = "../boom-hooks-sdk" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
reqwest = { workspace = true }
moka = { workspace = true, features = ["sync"] }
dashmap = { workspace = true }
rust_decimal = { workspace = true }
libloading = { workspace = true }

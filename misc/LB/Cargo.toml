[package]
name = "gateway-lb"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
async-trait = "0.1"
pingora-core = { version = "0.8", features = ["openssl"] }
pingora-proxy = { version = "0.8", features = ["openssl"] }
pingora-http = "0.8"
serde = { version = "1", features = ["derive"] }
ipnet = "2"
log = { version = "0.4", features = ["std"] }
serde_yaml = "0.9"
arc-swap = "1"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
clap = { version = "4", features = ["derive", "env"] }

[workspace]
resolver = "2"
members = ["crates/e2e-tools", "crates/e2e-envs", "crates/e2e-impl", "crates/e2e-runner"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

e2e-tools = { path = "crates/e2e-tools" }
e2e-envs = { path = "crates/e2e-envs" }
e2e-impl = { path = "crates/e2e-impl" }

[profile.dev]
# 网关以 debug 二进制被 spawn，测试负载小，debug 性能足够；加快编译
debug = 1

# BooMGateway CI — Rust workspace build & test
# 第一步：在个人仓验证基本流程（build + clippy + test）
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Job 1: workspace 编译 + clippy ──
  build-and-lint:
    name: Build & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace, release)
        run: cargo build --workspace --release

  # ── Job 2: workspace 测试 ──
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run tests
        run: cargo test --workspace --all-features

  # ── Job 3: 独立子项目编译（misc/LB + hook + bench-client） ──
  build-standalone:
    name: Build standalone crates
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            misc/LB/target
            hook/target
            boom-gateway/test/bench-client/target
            boom-gateway/test/mock-backend/target
          key: cargo-standalone-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-standalone-${{ runner.os }}-

      - name: Build misc/LB
        run: cd misc/LB && cargo build --release

      - name: Build hook SDK demo
        run: cd hook && cargo build --release

      - name: Build bench-client
        run: cd boom-gateway/test/bench-client && cargo build --release

      - name: Build mock-backend
        run: cd boom-gateway/test/mock-backend && cargo build --release

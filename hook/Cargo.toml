[package]
name = "pre-auth-demo"
version = "0.1.0"
edition = "2021"
publish = false

# 必须是 cdylib 才能产出 .so / .dylib 给 gateway 加载
[lib]
crate-type = ["cdylib"]

# 让本 crate 独立于仓库根 workspace（不在 workspace.members 里），
# 这样用户视角的 demo 是一个可独立分发的项目模板。
[workspace]

[dependencies]
boom-hooks-sdk = { path = "../boom-gateway/boom-hooks-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
